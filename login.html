<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Stok Stiker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen font-sans">
    <div class="w-full max-w-md p-6">
        <!-- Card Login -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-xl overflow-hidden p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl text-white text-2xl shadow-lg mb-4">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">STOK STIKER</h1>
                <p class="text-sm text-slate-500 mt-1">Silakan masuk ke akun Anda</p>
            </div>

            <!-- Flash Message Alerts -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="mb-6 space-y-2">
                        {% for category, message in messages %}
                            <div class="p-3 rounded-xl text-sm font-medium flex items-center gap-3 shadow-sm
                                {% if category == 'success' %} bg-emerald-50 text-emerald-800 border border-emerald-200
                                {% elif category == 'info' %} bg-blue-50 text-blue-800 border border-blue-200
                                {% else %} bg-rose-50 text-rose-800 border border-rose-200 {% endif %}">
                                <i class="fa-solid fa-circle-exclamation text-base"></i>
                                <span>{{ message }}</span>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="/" method="POST" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" name="username" required autofocus placeholder="Masukkan username"
                            class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="password" required placeholder="Masukkan password"
                            class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    </div>
                </div>

                <button type="submit"
                    class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md transition flex items-center justify-center gap-2">
                    <span>Masuk</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>
        </div>

        <div class="text-center mt-6 text-xs text-slate-400">
            &copy; {{ current_year or '2026' }} Sistem Manajemen Stok Stiker
        </div>
    </div>
</body>
</html>
